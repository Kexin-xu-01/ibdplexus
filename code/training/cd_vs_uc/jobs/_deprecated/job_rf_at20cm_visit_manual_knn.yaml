apiVersion: batch/v1
kind: Job
metadata:
  name: kgbk271-rf-at20cm-visit-manual-knn
  namespace: ibd-plexus-research
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: default-editor
      restartPolicy: Never
      volumes:
        - name: kgbk271-ibd-volume
          persistentVolumeClaim:
            claimName: kgbk271-ibd-volume
        - name: shared-data
          persistentVolumeClaim:
            claimName: shared-data
        - name: kgbk271-ibd-workspace
          persistentVolumeClaim:
            claimName: kgbk271-ibd-workspace
      containers:
        - name: rf
          image: harbor.csis.astrazeneca.net/azimuth-demo/cpu-codeserver:latest
          command:
            - /bin/bash
            - -c
            - |
              /home/jovyan/kgbk271-ibd-volume/envs/trident/bin/python \
                /home/jovyan/ibdplexus/code/training/cd_vs_uc/_deprecated/08b_train_at20cm_visit_level.py \
                --emb_base_dir /home/jovyan/kgbk271-ibd-volume/data/processed/tissue_threshold_15_filtered_no_darkspot_manual_knn/20x_224px_0px_overlap/prism2_base \
                --out_dir /home/jovyan/kgbk271-ibd-volume/training/cd_vs_uc/08_09_at20cm_manual_knn/results
          resources:
            requests:
              cpu: "1"
              memory: 10Gi
            limits:
              cpu: "2"
              memory: 14Gi
          env:
            - name: http_proxy
              value: "http://azpse.astrazeneca.net:9480"
            - name: https_proxy
              value: "http://azpse.astrazeneca.net:9480"
            - name: no_proxy
              value: "localhost,127.0.0.1,.svc.cluster.local,kubernetes.default.svc,astrazeneca.net,::1,10.0.0.0/8,172.30.0.0/8,172.29.0.0/8"
          volumeMounts:
            - name: kgbk271-ibd-volume
              mountPath: /home/jovyan/kgbk271-ibd-volume
            - name: shared-data
              mountPath: /home/jovyan/shared-data
            - name: kgbk271-ibd-workspace
              mountPath: /home/jovyan
