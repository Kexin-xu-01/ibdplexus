apiVersion: batch/v1
kind: Job
metadata:
  name: kgbk271-umap-scores-scores-manual-knn
  namespace: ibd-plexus-research
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: default-editor
      restartPolicy: Never
      tolerations:
        - effect: NoSchedule
          key: GPU_workload
          operator: Equal
          value: "true"
      volumes:
        - name: kgbk271-ibd-volume
          persistentVolumeClaim:
            claimName: kgbk271-ibd-volume
        - name: shared-data
          persistentVolumeClaim:
            claimName: shared-data
        - name: kgbk271-ibd-workspace
          persistentVolumeClaim:
            claimName: kgbk271-ibd-workspace
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
      containers:
        - name: umap-scores-scores-manual-knn
          image: harbor.csis.astrazeneca.net/azimuth-demo/cpu-codeserver:latest
          command:
            - /bin/bash
            - -c
            - |
              /home/jovyan/kgbk271-ibd-volume/envs/trident/bin/python \
                /home/jovyan/ibdplexus/code/prism2/umap/06_umap_uamp_scores.py \
                --umap_csv /home/jovyan/kgbk271-ibd-volume/results/prism2_manual_knn/prism2_histological_score.csv \
                --coords_npz \
                  /home/jovyan/kgbk271-ibd-volume/results/prism2_manual_knn/umap/umap_prism2_base_coords.npz \
                  /home/jovyan/kgbk271-ibd-volume/results/prism2_manual_knn/umap/umap_prism2_diagnostic_coords.npz \
                --out_dir /home/jovyan/kgbk271-ibd-volume/results/prism2_manual_knn/umap \
                --meta_csv /home/jovyan/kgbk271-ibd-volume/results/metadata/slide_metadata.csv
          resources:
            requests:
              cpu: "4"
              memory: 32Gi
            limits:
              cpu: "4"
              memory: 32Gi
          env:
            - name: http_proxy
              value: "http://azpse.astrazeneca.net:9480"
            - name: https_proxy
              value: "http://azpse.astrazeneca.net:9480"
            - name: no_proxy
              value: "localhost,127.0.0.1,.svc.cluster.local,kubernetes.default.svc,astrazeneca.net,::1,10.0.0.0/8,172.30.0.0/8,172.29.0.0/8"
            - name: HF_HOME
              value: "/home/jovyan/kgbk271-ibd-volume/huggingface_cache"
            - name: HF_HUB_CACHE
              value: "/home/jovyan/kgbk271-ibd-volume/huggingface_cache"
            - name: TRANSFORMERS_CACHE
              value: "/home/jovyan/kgbk271-ibd-volume/huggingface_cache"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_DATASETS_OFFLINE
              value: "1"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: kgbk271-ibd-volume
              mountPath: /home/jovyan/kgbk271-ibd-volume
            - name: shared-data
              mountPath: /home/jovyan/shared-data
            - name: kgbk271-ibd-workspace
              mountPath: /home/jovyan
